# PIXEL Domos Sync Rules
# Defines bidirectional sync behavior between pixel8 (internal) and pixel8a (external)

version: 1.0

# Bidirectional sync - changes sync both ways
bidirectional:
  - projects/shared/
  - docs/public/
  - assets/shared/

# Internal-only - never sync to external
internal_only:
  - .claude/
  - .eric/
  - projects/experimental/
  - projects/pixel8/
  - tools/
  - .sync/

# External-only - never sync to internal
external_only:
  - published/
  - releases/

# Global exclude patterns
exclude_patterns:
  # Temporary files
  - "*.tmp"
  - "*.log"
  - "*.swp"
  - "*~"
  - ".*.swp"

  # OS files
  - ".DS_Store"
  - "Thumbs.db"
  - "desktop.ini"

  # Version control
  - ".git/"
  - ".gitignore"

  # Dependencies
  - "node_modules/"
  - "vendor/"
  - "__pycache__/"
  - "*.pyc"

  # Build outputs
  - "dist/"
  - "build/"
  - "out/"

  # Sensitive
  - ".env"
  - "*.key"
  - "*.pem"
  - "secrets/"

# Sync behavior
behavior:
  conflict_resolution: "timestamp"  # Options: timestamp, manual, internal_wins, external_wins
  delete_sync: false                # Don't sync deletions automatically
  dry_run: false                    # Set to true to test without making changes
  verbose: true                     # Show detailed sync output

# Size limits (in MB)
limits:
  max_file_size: 100                # Warn on files over 100MB
  max_total_size: 1000              # Warn if total sync over 1GB
