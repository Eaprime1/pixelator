# Custos — Code Review
# Perspective: guardian, shepherd, protection of what is entrusted
name: Custos — Code Review

# Automatic Claude review on every pull request.
# Uses the CLAUDE_CODE_OAUTH_TOKEN repository secret (subscription-based auth,
# same as finalize-pr.yml). ANTHROPIC_API_KEY is intentionally not passed here:
# that key bills against a separate pay-per-token credit balance, and this repo
# has hit "Credit balance is too low" failures on it before. Note the secret
# still exists in repo secrets for whenever API-key billing is wanted again.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # `secrets` is not a recognized named-value inside a job-level `if:` —
    # GitHub Actions rejects the whole expression at parse time when it's
    # included here (visible as phantom 0-job "push" failures for this
    # workflow on every commit, regardless of branch).
    if: ${{ github.event.pull_request.head.repo.fork == false && !contains(fromJSON('["Copilot","copilot[bot]","github-actions[bot]","dependabot[bot]"]'), github.actor) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Detect self-modified review workflow
        id: workflow-change
        uses: actions/github-script@v7
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const workflowChanged = files.some(
              (file) => file.filename === '.github/workflows/claude-code-review.yml'
            );
            core.setOutput('self_modified', workflowChanged ? 'true' : 'false');
            if (workflowChanged) {
              core.notice(
                'Skipping Claude review because this PR changes .github/workflows/claude-code-review.yml and GitHub blocks OIDC app-token exchange for self-modifying workflow reviews.'
              );
            }

      - name: Run Claude Code Review
        id: claude-review
        if: ${{ steps.workflow-change.outputs.self_modified != 'true' }}
        # v1 tag currently points to v1.0.140 (resolved to immutable commit SHA)
        uses: anthropics/claude-code-action@fbda2eb1bdc90d319b8d853f5deb53bca199a7c1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # anthropic_api_key disabled — pay-per-use credit balance is empty.
          # Re-enable once console.anthropic.com account is funded:
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          additional_permissions: |
            actions: read
          allowed_bots: '*'
          prompt: |
            Review this pull request for the pixelator repo.

            Context: pixelator is a Python image-pixelation tool with a
            Termux/Android automation layer — pixelator_agent.py,
            pixelator_config.py, shell automation scripts (pixelator_automate.sh,
            termux_proc.sh), and pytest coverage in test_sample.py.

            Focus on:
            - Broken Python, shell, or workflow syntax
            - Logic errors in image/pixel processing or config handling
            - Shell scripts that don't handle errors or edge cases (unset vars,
              missing files, non-zero exits)
            - Internal links and paths that do not resolve
            - Accidental duplication or merge artifacts

            Post concise inline comments only where action is genuinely needed.
          claude_args: '--allowed-tools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"'

# ∰🛠️🌿🔒-custos_canon
